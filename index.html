<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D Model</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .viewer {
      width: 100%;
      height: 100vh;
      min-height: 500px;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #f5f5f5;
    }

    .help {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      color: #222;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
  <div class="viewer">
    <model-viewer
      src="model.glb"
      alt="Interactive 3D model"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      interaction-prompt="auto">
    </model-viewer>

    <div class="help">
      Drag to rotate • Scroll or pinch to zoom
    </div>
  </div>
</body>
</html>
